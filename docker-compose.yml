# InvenTree 生产部署（群晖 DS920+ / amd64 / DSM 7.3.2）
# HTTP 直连 http://192.168.1.188:1337，不启用 TLS，避开 DSM 的 80/443。
# 所有可调参数都在 .env 里，本文件一般无需改动（端口除外）。

services:
  # PostgreSQL 数据库
  inventree-db:
    image: postgres:17
    container_name: inventree-db
    expose:
      - ${INVENTREE_DB_PORT:-5432}/tcp
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdb
      - POSTGRES_USER=${INVENTREE_DB_USER:?missing INVENTREE_DB_USER}
      - POSTGRES_PASSWORD=${INVENTREE_DB_PASSWORD:?missing INVENTREE_DB_PASSWORD}
      - POSTGRES_DB=${INVENTREE_DB_NAME:?missing INVENTREE_DB_NAME}
    volumes:
      - ${INVENTREE_EXT_VOLUME:?missing INVENTREE_EXT_VOLUME}:/var/lib/postgresql/data/:z
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Redis 缓存
  inventree-cache:
    image: redis:7-alpine
    container_name: inventree-cache
    command: redis-server --save "" --appendonly no
    env_file:
      - .env
    expose:
      - ${INVENTREE_CACHE_PORT:-6379}
    volumes:
      - ${INVENTREE_EXT_VOLUME}/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always

  # InvenTree Web 服务（gunicorn）
  inventree-server:
    image: inventree/inventree:${INVENTREE_TAG:-stable}
    container_name: inventree-server
    expose:
      - ${INVENTREE_WEB_PORT:-8000}
    depends_on:
      inventree-db:
        condition: service_healthy
      inventree-cache:
        condition: service_healthy
    env_file:
      - .env
    environment:
      INVENTREE_SERVER: http://inventree-server:${INVENTREE_WEB_PORT}
    volumes:
      - ${INVENTREE_EXT_VOLUME}:/home/inventree/data:z
    healthcheck:
      test: ['CMD-SHELL', 'invoke server-health --address "http://localhost:$${INVENTREE_WEB_PORT:-8000}"']
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # 后台任务 worker（django-q）
  inventree-worker:
    image: inventree/inventree:${INVENTREE_TAG:-stable}
    container_name: inventree-worker
    command: invoke worker
    depends_on:
      inventree-server:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ${INVENTREE_EXT_VOLUME}:/home/inventree/data:z
    healthcheck:
      test: ['CMD-SHELL', 'invoke worker-health']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
    restart: unless-stopped

  # Caddy 反代 + 静态/媒体文件
  inventree-proxy:
    container_name: inventree-proxy
    image: caddy:alpine
    restart: always
    depends_on:
      inventree-server:
        condition: service_healthy
      inventree-worker:
        condition: service_healthy
    ports:
      - "1337:1337"          # 只发布 1337，避开 DSM 的 80/443
    env_file:
      - .env
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:9090/api/system/health/']
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - ${INVENTREE_EXT_VOLUME}/static:/var/www/static:z
      - ${INVENTREE_EXT_VOLUME}/media:/var/www/media:z
      - ${INVENTREE_EXT_VOLUME}:/var/log:z
      - ${INVENTREE_EXT_VOLUME}:/data:z
      - ${INVENTREE_EXT_VOLUME}:/config:z
