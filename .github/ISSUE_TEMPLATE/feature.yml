name: 需求提议
about: 提出一个新功能或改进需求
title: "[需求] "
labels:
  - 类型/需求
body:
  - type: textarea
    id: background
    attributes:
      label: 需求背景
      description: 说明为什么需要这个功能，解决什么痛点
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 需求描述
      description: 清晰描述期望实现的功能
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 满足哪些条件视为完成
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 参考
      description: 是否考虑过其他实现，或有参考资料/截图
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: 影响范围
      description: 涉及模块、是否影响现有功能、是否需要配置/迁移
    validations:
      required: false